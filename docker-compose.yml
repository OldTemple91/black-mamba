services:
  # ─────────────────────────────────────────────────────
  # Application
  # ─────────────────────────────────────────────────────
  app:
    build: .
    container_name: black-mamba-app
    ports:
      - "8081:8081"
    environment:
      # RAG 킬 스위치 (Qdrant 장애 시 회피책).
      # 기본: 비어있음 → 전체 AutoConfig 활성 (Qdrant 필요).
      # Qdrant 장애 시:
      #   SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration
      #   docker compose up -d app
      # → VectorStore 빈 생성 스킵 → RouteHistoryPort 빈 부재 → RAG 기능 graceful 비활성
      # → /api/routes 기본 탐색은 완전 정상, narrative 만 템플릿으로 폴백
      - SPRING_AUTOCONFIGURE_EXCLUDE=${SPRING_AUTOCONFIGURE_EXCLUDE:-}
      - ODSAY_API_KEY=${ODSAY_API_KEY}
      - DDAREUNGI_API_KEY=${DDAREUNGI_API_KEY}
      - TAGO_API_KEY=${TAGO_API_KEY}
      - TMAP_APP_KEY=${TMAP_APP_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID:-}
      - NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET:-}
      # Phase 3: 트레이싱 (OTLP/gRPC → Tempo)
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4317
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
      # RAG Phase 1: 호스트의 Ollama로 접근 (Mac/Windows: host.docker.internal)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # RAG Phase 2: Qdrant 벡터 DB (경로 이력 유사 검색)
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # Phase 1: Metrics
  # ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: black-mamba-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'  # Tempo metrics-generator → Prometheus 푸시 수신
      - '--enable-feature=exemplar-storage'    # Exemplars: 메트릭 샘플에 trace_id 저장 → Grafana에서 Tempo 점프
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.3
    container_name: black-mamba-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # M-5: 익명 접근은 Viewer 로 제한.
      # Admin 작업은 GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD 로만 가능.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # Phase 2: Logs
  # ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.1
    container_name: black-mamba-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      # M-6: 로그 데이터 영속화 (컴팩터가 7일 초과분 자동 삭제).
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # Phase 3: Traces
  # ─────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.10.4
    container_name: black-mamba-tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "9411:9411"   # Zipkin receiver (Before 비교용으로 유지)
      - "4317:4317"   # OTLP/gRPC receiver ← OTLP/gRPC 전환 대상
      - "4318:4318"   # OTLP/HTTP receiver
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      # M-6: 트레이스 데이터를 도커 볼륨에 영속 저장 (재기동 시 유지).
      - tempo-data:/var/tempo
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # M-1: Alertmanager (Discord 웹훅 알림)
  # ─────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: black-mamba-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - alertmanager-data:/alertmanager
    # Alertmanager 는 env var 치환을 지원하지 않으므로, 시작 시 sh 로 template → 실제 config 생성.
    # docker-compose 의 $$ 는 컨테이너 런타임에서 $ 로 해석됨 (이스케이프).
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sed "s@PLACEHOLDER_DISCORD_WEBHOOK@$$DISCORD_WEBHOOK_URL@g" \
          /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=http://localhost:9093
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/DISABLED/DISABLED}
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # M-2: 호스트/컨테이너 메트릭
  # ─────────────────────────────────────────────────────
  # cAdvisor — 컨테이너별 CPU/Mem/Network/FS 메트릭 수집
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: black-mamba-cadvisor
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  # Node Exporter — 호스트 CPU/Mem/Disk/Load
  # macOS/Docker Desktop 에서는 VM 레벨 값이 보이지만 상대 추이는 유의미.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: black-mamba-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # RAG Phase 2: Vector DB
  # ─────────────────────────────────────────────────────
  # 경로 이력을 1024차원 벡터(bge-m3)로 임베딩해 저장.
  # 사용자 자연어 쿼리를 벡터화해 코사인 유사도로 유사 경로를 검색.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: black-mamba-qdrant
    ports:
      - "6333:6333"   # REST API (대시보드: http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC API (Spring AI 가 gRPC 사용)
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:
  qdrant-data:
  alertmanager-data:
  tempo-data:   # M-6
  loki-data:    # M-6

networks:
  monitoring:
    driver: bridge
