services:
  # Backend API + Frontend (단일 컨테이너)
  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      - ODSAY_API_KEY=${ODSAY_API_KEY}
      - DDAREUNGI_API_KEY=${DDAREUNGI_API_KEY}
      - TAGO_API_KEY=${TAGO_API_KEY}
      - TMAP_APP_KEY=${TMAP_APP_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID:-}
      - NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
