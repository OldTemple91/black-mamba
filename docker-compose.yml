services:
  # ─────────────────────────────────────────────────────
  # Application
  # ─────────────────────────────────────────────────────
  app:
    build: .
    container_name: black-mamba-app
    ports:
      - "8081:8081"
    environment:
      - ODSAY_API_KEY=${ODSAY_API_KEY}
      - DDAREUNGI_API_KEY=${DDAREUNGI_API_KEY}
      - TAGO_API_KEY=${TAGO_API_KEY}
      - TMAP_APP_KEY=${TMAP_APP_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_SEARCH_CLIENT_ID=${NAVER_SEARCH_CLIENT_ID:-}
      - NAVER_SEARCH_CLIENT_SECRET=${NAVER_SEARCH_CLIENT_SECRET:-}
      # Phase 3: 트레이싱 (OTLP/gRPC → Tempo)
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=http://tempo:4317
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # Phase 1: Metrics
  # ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: black-mamba-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'  # Tempo metrics-generator → Prometheus 푸시 수신
      - '--enable-feature=exemplar-storage'    # Exemplars: 메트릭 샘플에 trace_id 저장 → Grafana에서 Tempo 점프
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.4.3
    container_name: black-mamba-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./monitoring/grafana-datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # Phase 2: Logs
  # ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.1
    container_name: black-mamba-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # ─────────────────────────────────────────────────────
  # Phase 3: Traces
  # ─────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.10.4
    container_name: black-mamba-tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "9411:9411"   # Zipkin receiver (Before 비교용으로 유지)
      - "4317:4317"   # OTLP/gRPC receiver ← OTLP/gRPC 전환 대상
      - "4318:4318"   # OTLP/HTTP receiver
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
