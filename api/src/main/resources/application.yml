server:
  port: 8081

# A-1: SSE 스트림은 최대 5분간 열려 있을 수 있어야 함.
# Spring MVC 의 async 요청 기본 타임아웃(30s) 을 넘어서 설정.
spring.mvc:
  async:
    request-timeout: 600000   # 10분 (SSE 스트림 5분 + 여유분)

spring:
  application:
    name: black-mamba
  profiles:
    active: local
  # Reactor 체인에서 traceId/spanId가 MDC로 전파되도록 활성화
  # (기본값은 NONE — Reactor 스레드가 Micrometer Observation 컨텍스트 못 받음)
  reactor:
    context-propagation: auto
  # Java 21 Virtual Thread — Tomcat 워커 가상화 (ADR-008)
  # Controller 의 .block() 이 platform thread 가 아닌 가상 스레드를 점유
  # → 외부 API 대기(평균 2초) 동안 동시 처리량이 워커 수(200)에 묶이지 않음.
  # Reactor(외부 API 합성·SSE)는 유지 — 적재적소 분리.
  threads:
    virtual:
      enabled: true

odsay:
  api-key: ${ODSAY_API_KEY}
  request-timeout-ms: 5000

ddareungi:
  api-key: ${DDAREUNGI_API_KEY}
  request-timeout-ms: 5000
  refresh-backoff-ms: 30000
  # 갱신 실패 시 이전 snapshot 을 재사용하는 상한 — 이보다 오래된 재고는 "대여 가능" 근거로 쓰지 않는다
  max-stale-age-ms: 900000

tago:
  api-key: ${TAGO_API_KEY}
  city-code: 11   # 서울특별시 지역코드
  request-timeout-ms: 5000
  # 공유 킥보드 조회용 TAGO API (GetPMListByProvider).
  # 서울 데이터 미제공 상태 (2026-04 기준) → 기본값 false 로 외부 호출 스킵.
  # 추후 서울 데이터 제공 시 TAGO_ENABLED=true 로 복구 가능.
  enabled: ${TAGO_ENABLED:false}

tmap:
  app-key: ${TMAP_APP_KEY}
  request-timeout-ms: 5000

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  request-timeout-ms: 3000
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# RAG Phase 1: Ollama 로컬 LLM (자연어 경로 검색)
# - 로컬: Ollama 기본 포트 11434
# - Docker 환경: host.docker.internal:11434
#
# 모델 선택 (환경변수 OLLAMA_MODEL 로 교체 가능):
# - llama3.2:3b   (기본, 1.9GB, 2~5초 응답, 한국어 기본 파싱 OK)
# - qwen2.5:7b    (4.7GB, 한국어 품질 훨씬 좋음, 수식어 포함 쿼리 정확)
# - exaone3.5:7.8b (5GB, LG AI 연구원, 한국어 특화)
# 모델 교체: `ollama pull qwen2.5:7b && OLLAMA_MODEL=qwen2.5:7b` 후 재기동
# Spring AI 의 Ollama 호출은 RestClient 를 쓴다. 기본값은 읽기 타임아웃 없음 + 재시도 10회라,
# Ollama 가 연결만 받고 응답하지 않으면 자연어 검색 요청이 45초 넘게 붙잡혔다(실측).
# 로컬 LLM 은 재시도로 회복되는 장애가 드물다 — 빨리 포기하고 폴백(원본 narrative / 503)한다.
spring.http.clients:
  connect-timeout: 2s
  read-timeout: 10s

spring.ai:
  retry:
    max-attempts: 1
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat:
      options:
        model: ${OLLAMA_MODEL:llama3.2:3b}
        temperature: 0.2    # JSON 파싱용이라 결정성 높게
    # RAG Phase 2: 경로 이력 임베딩용 모델
    # - bge-m3 (BAAI, 1024차원, 다국어/한국어 강함, 1.2GB)
    # - 사용 전 `ollama pull bge-m3` 필요
    embedding:
      options:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

  # RAG Phase 2: Qdrant Vector Store (경로 이력 저장 + 유사 검색)
  # - gRPC 연결 (HTTP REST 보다 빠름, Spring AI 기본값)
  # - collection 이름: navigation-route-history
  # - initializeSchema: true → 앱 기동 시 collection 자동 생성
  vectorstore:
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      collection-name: navigation-route-history
      initialize-schema: true
      use-tls: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: black-mamba
    distribution:
      # p50, p95, p99 히스토그램 자동 생성
      percentiles-histogram:
        http.server.requests: true
        navigation.route.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        navigation.route.duration: 0.5, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true
  # Phase 3: 분산 추적 (OTLP/gRPC → Tempo)
  # - Protobuf 직렬화 + HTTP/2 멀티플렉싱으로 페이로드/지연 모두 감소
  # - OpenTelemetry 표준 준수 (벤더 중립)
  # Boot 4: management.otlp.tracing.* → management.opentelemetry.tracing.export.otlp.*
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/gRPC endpoint (Tempo 4317 포트)
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4317}
          transport: grpc
          compression: gzip

navigation:
  mobility:
    search-radius-meters: 700
  cache:
    # 만료 엔트리 주기 청소 간격 (@Scheduled fixedDelay) — 재조회 없는 키의 힙 잔류 방지
    purge-interval-ms: 300000
    # ODsay 경로는 시간표 기반(실시간 아님)이라 분 단위로 바뀌지 않는다.
    # 30초였을 땐 SSE 재탐색 주기(30초)와 같아 재탐색마다 전부 miss — 스트림 하나가 5분간 ODsay 를 약 120회 불렀다.
    # 5분이면 재탐색은 가용성(20초 TTL)만 다시 보고 대중교통 구간은 캐시에서 온다
    odsay-route-ttl-ms: 300000
    ddareungi-snapshot-ttl-ms: 30000
    kickboard-snapshot-ttl-ms: 30000
    mobility-availability-ttl-ms: 20000
    tmap-pedestrian-route-ttl-ms: 300000
    tmap-rate-limit-backoff-ms: 3600000

# T-3: Resilience4j — 외부 API 장애 자동 대응
# - CircuitBreaker: 실패 임계값 초과 시 회로 차단 → fallback 메서드 호출
# - Retry: 네트워크 일시 장애 자동 재시도 (지수 백오프)
# Prometheus 메트릭도 자동 노출되어 Grafana 에서 회로 상태 모니터링 가능.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10            # 최근 10회 호출을 기준으로
        minimumNumberOfCalls: 5          # 최소 5회 호출 이후 계산 시작
        failureRateThreshold: 50         # 실패율 50% 이상 → OPEN
        waitDurationInOpenState: 10s     # OPEN 상태 10초 유지 후 HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3  # HALF_OPEN 에서 3회 시도
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 목록에 없는 예외는 '성공' 으로 집계된다 — 클라이언트가 던지는 ExternalApiException 계열을 반드시 포함
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.blackmamba.navigation.infra.common.http.ExternalApiException
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      odsay:
        baseConfig: default
      tmap:
        baseConfig: default
      ddareungi:
        baseConfig: default
      kickboard:
        baseConfig: default
      naver-geocoding:
        baseConfig: default
      naver-local:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # 5xx 만 재시도 — 4xx(키 오류·한도) 는 재시도해도 같은 답
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - com.blackmamba.navigation.infra.common.http.ExternalApiServerException
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      odsay:
        baseConfig: default
      tmap:
        baseConfig: default
      ddareungi:
        baseConfig: default
      kickboard:
        baseConfig: default
      naver-geocoding:
        baseConfig: default
      naver-local:
        baseConfig: default
