server:
  port: 8081

spring:
  application:
    name: black-mamba
  profiles:
    active: local
  # Reactor 체인에서 traceId/spanId가 MDC로 전파되도록 활성화
  # (기본값은 NONE — Reactor 스레드가 Micrometer Observation 컨텍스트 못 받음)
  reactor:
    context-propagation: auto

odsay:
  api-key: ${ODSAY_API_KEY}

ddareungi:
  api-key: ${DDAREUNGI_API_KEY}
  request-timeout-ms: 5000
  refresh-backoff-ms: 30000

tago:
  api-key: ${TAGO_API_KEY}
  city-code: 11   # 서울특별시 지역코드

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: black-mamba
    distribution:
      # p50, p95, p99 히스토그램 자동 생성
      percentiles-histogram:
        http.server.requests: true
        navigation.route.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        navigation.route.duration: 0.5, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true
  # Phase 3: 분산 추적 (OTLP/gRPC → Tempo)
  # Spring Boot 3.5+ : transport: grpc 공식 지원
  # - Protobuf 직렬화 + HTTP/2 멀티플렉싱으로 페이로드/지연 모두 감소
  # - OpenTelemetry 표준 준수 (벤더 중립)
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # OTLP/gRPC endpoint (Tempo 4317 포트)
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4317}
      transport: grpc
      compression: gzip

navigation:
  mobility:
    search-radius-meters: 700
  cache:
    odsay-route-ttl-ms: 30000
    ddareungi-snapshot-ttl-ms: 30000
    kickboard-snapshot-ttl-ms: 30000
    mobility-availability-ttl-ms: 20000
    tmap-pedestrian-route-ttl-ms: 300000
    tmap-rate-limit-backoff-ms: 3600000
