apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':application')
    implementation project(':domain')
    implementation project(':infra')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.projectreactor:reactor-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Phase 1: Prometheus Metrics — actuator /prometheus 엔드포인트 노출
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Phase 2: Loki 로그 Push (loki4j 2.0.0 - Structured Metadata 지원)
    implementation 'com.github.loki4j:loki-logback-appender:2.0.0'

    // Phase 3: 분산 추적 (Micrometer Tracing → OTLP/gRPC → Tempo)
    // 기존 Zipkin/HTTP → OTLP/gRPC 전환 (2026-04-17)
    // - Protobuf 직렬화로 페이로드 약 60% 감소
    // - HTTP/2 멀티플렉싱으로 전송 지연 감소
    // - OpenTelemetry 표준 준수 (벤더 중립)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    // @Observed 어노테이션을 AOP로 처리
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // RAG Phase 1: Spring AI + Ollama — 자연어 경로 검색 인터페이스
    implementation platform('org.springframework.ai:spring-ai-bom:1.0.2')
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
}
