name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test & Coverage
    runs-on: ubuntu-latest
    env:
      ODSAY_API_KEY: dummy-ci-key
      DDAREUNGI_API_KEY: dummy-ci-key
      TAGO_API_KEY: dummy-ci-key
      TMAP_APP_KEY: dummy-ci-key
      NAVER_CLIENT_ID: dummy-ci-key
      NAVER_CLIENT_SECRET: dummy-ci-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build & Test
        run: ./gradlew build jacocoRootReport --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/aggregate/
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          check_name: "Backend Test Results"

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    env:
      IMAGE_TAG: black-mamba:ci-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts and responds to health check
        env:
          IMAGE: ${{ env.IMAGE_TAG }}
        run: |
          docker run -d --name black-mamba-test \
            -e ODSAY_API_KEY=dummy \
            -e DDAREUNGI_API_KEY=dummy \
            -e TAGO_API_KEY=dummy \
            -e TMAP_APP_KEY=dummy \
            -e NAVER_CLIENT_ID=dummy \
            -e NAVER_CLIENT_SECRET=dummy \
            -p 8081:8081 \
            "$IMAGE"

          for i in $(seq 1 12); do
            if curl -sf http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "Health check OK at attempt $i"
              docker logs black-mamba-test --tail 20
              docker stop black-mamba-test
              exit 0
            fi
            echo "Waiting... ($i/12)"
            sleep 5
          done

          echo "Health check failed"
          docker logs black-mamba-test
          exit 1
