server:
  http_listen_port: 3200

# Tempo 2.10+ : receiver endpoint를 명시해야 컨테이너 네트워크에서 접근 가능
distributor:
  receivers:
    zipkin:
      endpoint: "0.0.0.0:9411"
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # M-6: 1h → 24h 로 확대.
    # 재기동 없이도 최근 하루치 트레이스를 조회 가능 (포트폴리오 시연 편의).
    block_retention: 24h
    compacted_block_retention: 1h

# M-6: /var/tempo 를 도커 볼륨으로 마운트해 재기동 시 트레이스 유지.
# 볼륨 매핑이 /tmp 이면 컨테이너 종료 시 데이터 소실.
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
