global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'black-mamba-app'
    metrics_path: '/actuator/prometheus'
    # Exemplars 수집: Micrometer는 히스토그램/카운터에 trace_id를 exemplar로 첨부
    # OpenMetrics 포맷으로 요청해야 Prometheus가 exemplars를 파싱 가능
    scrape_classic_histograms: true
    static_configs:
      - targets: ['app:8081']
        labels:
          application: 'black-mamba'
          environment: 'local'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
