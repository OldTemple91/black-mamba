global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    application: black-mamba

# M-1: Alertmanager 연동
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# M-1/M-3: 알림 룰 + Recording 룰
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'black-mamba-app'
    metrics_path: '/actuator/prometheus'
    # Exemplars 수집: Prometheus 3.x 기본 동작으로 OpenMetrics 포맷 자동 파싱.
    # Micrometer가 히스토그램/카운터에 trace_id를 exemplar로 첨부하면 자동 수집됨.
    static_configs:
      - targets: ['app:8081']
        labels:
          application: 'black-mamba'
          environment: 'local'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # M-1: Alertmanager self-monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # M-2: 컨테이너 메트릭 (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # M-2: 호스트 메트릭 (Node Exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
