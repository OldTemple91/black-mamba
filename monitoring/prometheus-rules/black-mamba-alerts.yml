## M-1: Black Mamba 알림 룰 5종
##
## 원칙:
## - for: 는 "얼마나 지속되어야 알람으로 인정하는가" — 순간 스파이크는 무시.
## - severity: critical(즉시 대응) / warning(팀 채널 참고).
## - 각 알람은 runbook_url 또는 summary 로 "무엇을 해야 하나" 를 즉시 안내.

groups:
  - name: black-mamba-alerts
    interval: 30s
    rules:

      # ───────────────────────────────────────────────
      # ① 경로 탐색 p95 지연 > 3초 지속 (5분)
      # ───────────────────────────────────────────────
      - alert: RouteSearchHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(navigation_route_duration_seconds_bucket[5m]))
          ) > 3
        for: 5m
        labels:
          severity: warning
          service: navigation
          slo: latency
        annotations:
          summary: "🐢 경로 탐색 p95 > 3s (최근 5분 지속)"
          description: |
            현재 p95 = {{ $value | humanizeDuration }}.
            SLO(p95 < 2s) 초과. ODsay/Tmap 응답 지연 또는 내부 병목 점검 필요.
          runbook: "Grafana Route Performance 대시보드 → p95 히트맵 → Tempo exemplar 트레이스 점프"

      # ───────────────────────────────────────────────
      # ② 전체 요청의 5xx 비율 > 5% 지속 (5분)
      # ───────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: navigation
          slo: availability
        annotations:
          summary: "🔥 5xx 에러율 > 5% (5분 지속)"
          description: |
            5xx 비율 = {{ $value | humanizePercentage }}.
            SLO(가용성 99%) 위협. GlobalExceptionHandler 로그 + /actuator/circuitbreakers 확인.
          runbook: "Loki 에서 stack_trace=* | severity=ERROR 검색 → 트레이스 점프"

      # ───────────────────────────────────────────────
      # ③ 외부 API Circuit Breaker OPEN 상태
      # ───────────────────────────────────────────────
      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
          service: navigation
          slo: availability
        annotations:
          summary: "⚡ Circuit Breaker OPEN — {{ $labels.name }}"
          description: |
            외부 API `{{ $labels.name }}` 의 회로가 차단되었습니다.
            실패율 임계값(50%) 초과. fallback 경로로 서비스 유지 중이지만 품질 저하.
          runbook: "/actuator/circuitbreakers 로 현재 상태 + 최근 이벤트 확인"

      # ───────────────────────────────────────────────
      # ④ 따릉이 Fallback 발동 빈번
      # ───────────────────────────────────────────────
      - alert: DdareungiFallbackSpike
        expr: |
          sum(rate(navigation_mobility_fallback_total{mobility="ddareungi",reason="error"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          service: navigation
          mobility: ddareungi
        annotations:
          summary: "🚲 따릉이 가용성 조회 실패 빈도 상승 (>0.2/s)"
          description: |
            따릉이 snapshot 을 확보하지 못해 "대여 후보 없음" 으로 답하는 조회가 늘고 있습니다.
            (어댑터가 출처 EMPTY 인 snapshot 을 오류로 집계 — 혼합 경로가 만들어지지 않음)
            서울시 공공데이터 API 상태 확인.
          runbook: "External APIs 대시보드 → 따릉이 패널 → Loki 최근 에러 확인"

      # ───────────────────────────────────────────────
      # ④-b 따릉이 snapshot 갱신 실패 (stale 재사용 / 재사용 한도 초과)
      #     갱신이 실패해도 15분까지는 이전 snapshot 으로 버틴다 — 그 사이에 알아채기 위한 경보
      # ───────────────────────────────────────────────
      - alert: DdareungiSnapshotRefreshFailing
        expr: |
          sum(increase(navigation_ddareungi_fallback_total{reason="refresh_backoff"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: navigation
          mobility: ddareungi
        annotations:
          summary: "🚲 따릉이 snapshot 갱신이 계속 실패 중 (10분간 5회 이상)"
          description: |
            오류 봉투(HTTP 200 + RESULT)·인증키 오류(XML)·0개 응답·타임아웃 중 하나입니다.
            지금은 이전 snapshot(STALE)으로 응답 중이며, 15분이 지나면 따릉이 경로가 사라집니다.
          runbook: "Loki 에서 '[따릉이 API] snapshot 조회 실패' 원인 확인 → 인증키·서울시 API 상태 점검"

      - alert: DdareungiSnapshotExpired
        expr: |
          sum(increase(navigation_ddareungi_fallback_total{reason=~"stale_expired|empty_snapshot"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: navigation
          mobility: ddareungi
        annotations:
          summary: "🚲 따릉이 데이터 없음 — 재사용 한도를 넘겼거나 한 번도 받지 못함"
          description: |
            쓸 수 있는 따릉이 snapshot 이 없습니다. 따릉이 혼합 경로가 전부 빠진 응답이 나가고 있습니다.
          runbook: "Loki 에서 'stale snapshot 이 ... 재사용 한도' 또는 '사용 가능한 snapshot 없음' 확인"

      # ───────────────────────────────────────────────
      # ④-c ODsay 오류 폴백 — 추정 경로로 대체되는 비율
      #     HTTP 200 오류 봉투(키·한도·서버 오류)도 여기 집계된다
      # ───────────────────────────────────────────────
      - alert: OdsayErrorFallbackSpike
        expr: |
          sum(rate(navigation_odsay_fallback_total{type="transit_route",reason="error"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: navigation
        annotations:
          summary: "🚇 ODsay 호출 실패로 대중교통 구간이 추정값으로 대체되는 중 (>0.1/s)"
          description: |
            실패한 구간은 직선거리 기반 추정(소요시간·요금)으로 대체됩니다. 일일 한도 초과·API 키·ODsay 장애를 확인하세요.
          runbook: "Loki 에서 '[ODsay] 호출 실패(최종)' 의 원인 코드 확인"

      # ───────────────────────────────────────────────
      # ④-c2 외부 API 일일 예산 — 소진되면 그날 남은 요청의 대중교통 구간이 전부 추정값이 된다
      # ───────────────────────────────────────────────
      - alert: ApiBudgetLow
        # 기준은 코드와 같은 값을 쓴다(saving-remaining-ratio 를 여기 따로 적지 않는다). 소진은 아래 규칙이 맡는다
        expr: |
          navigation_api_budget_remaining <= navigation_api_budget_saving_threshold
          and navigation_api_budget_remaining > 0
        for: 1m
        labels:
          severity: warning
          service: navigation
        annotations:
          summary: "💸 {{ $labels.api }} 일일 호출 예산이 절약 수준"
          description: |
            절약 수준에 들어가 후보 허브 수가 줄고 패턴 D 가 생략됩니다(추천 폭 감소).
          runbook: "External APIs 대시보드에서 호출량 추이 확인 → 한도 상향 또는 캐시 TTL 조정 검토"

      - alert: ApiBudgetExhausted
        expr: |
          navigation_api_budget_remaining <= 0
        for: 1m
        labels:
          severity: critical
          service: navigation
        annotations:
          summary: "💸 {{ $labels.api }} 일일 호출 예산 소진"
          description: |
            집계한 예산을 다 썼거나(내일까지) API 가 한도 초과로 답했습니다(15분마다 다시 확인). 그동안 대중교통 구간은 기준 경로·직선거리 기반 추정값으로 응답 중입니다.
          runbook: "요금제 한도 확인(ODSAY_DAILY_LIMIT) → 필요 시 상향 후 재기동"

      # ───────────────────────────────────────────────
      # ④-d 경로 탐색 오류율 (타임아웃이 아닌 실패)
      # ───────────────────────────────────────────────
      - alert: RouteSearchErrorRateHigh
        expr: |
          sum(rate(navigation_route_duration_seconds_count{outcome="error"}[5m]))
          /
          sum(rate(navigation_route_duration_seconds_count[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
          service: navigation
          slo: availability
        annotations:
          summary: "🧭 경로 탐색 오류율 5% 초과"
          description: |
            타임아웃이 아닌 예외로 실패한 /api/routes 요청 비율입니다. 스택은 '[전역 예외]' 로그에 있습니다.
          runbook: "Loki 에서 '[전역 예외]' 검색 → traceId 로 Tempo 추적"

      # ───────────────────────────────────────────────
      # ④-e RAG 이력 저장 실패 — 사용자 요청에는 영향 없지만 이력이 쌓이지 않는다
      # ───────────────────────────────────────────────
      - alert: RagHistorySaveFailing
        expr: |
          sum(increase(navigation_rag_history_failed_total[15m])) >= 3
        for: 5m
        labels:
          severity: warning
          service: navigation
        annotations:
          summary: "🧠 경로 이력(RAG) 저장 실패 반복"
          description: |
            임베딩(Ollama bge-m3) 또는 Qdrant 저장이 실패·타임아웃하고 있습니다. 유사 이력 근거가 갱신되지 않습니다.
          runbook: "Ollama·Qdrant 상태 확인 → Loki 에서 '[RAG] 비동기 저장 실패' 확인"

      # ───────────────────────────────────────────────
      # ⑤ JVM Heap 사용률 높음 (운영 환경 조기 경보)
      # ───────────────────────────────────────────────
      - alert: JvmHeapHigh
        expr: |
          sum by (instance) (jvm_memory_used_bytes{area="heap"})
          /
          sum by (instance) (jvm_memory_max_bytes{area="heap"})
          > 0.85
        for: 10m
        labels:
          severity: warning
          service: navigation
        annotations:
          summary: "🧠 JVM Heap 사용률 > 85% (10분 지속)"
          description: |
            인스턴스 {{ $labels.instance }} Heap 사용률 {{ $value | humanizePercentage }}.
            GC pressure 또는 메모리 누수 가능성. Overview 대시보드 JVM 패널 확인.
          runbook: "Grafana Overview → JVM Heap/GC → jcmd 또는 heap dump 검토"
