apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    uid: prometheus

  # Phase 2에서 활성화
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    uid: loki
    jsonData:
      # JSON 로그의 "traceId":"abc123" 패턴을 파싱하여
      # 해당 traceId를 Tempo로 점프할 수 있는 링크 생성
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          name: traceId
          url: '$${__value.raw}'
          urlDisplayLabel: 'Tempo에서 트레이스 보기'

  # Phase 3에서 활성화
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    uid: tempo
    jsonData:
      tracesToLogsV2:
        datasourceUid: 'loki'
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true
      serviceMap:
        datasourceUid: 'prometheus'
      nodeGraph:
        enabled: true
